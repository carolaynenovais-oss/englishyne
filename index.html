<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Englishyne: app para aprender inglês do A1 ao C2.">
<meta name="theme-color" content="#2C55E0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232C55E0'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EE%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.ENGLISHYNE_NETLIFY=true;</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<title>Englishyne</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one study column; sticky tab bar; corrections drawn like a teacher's red pen over a clean notebook page */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#E9EDF5; --line:#D5DBE7;
  --ink:#141B2D; --muted:#5A6378;
  --accent:#2C55E0; --accent-ink:#FFFFFF; --accent-soft:#E2E9FF;
  --marker:#FFE45C; --marker-ink:#141B2D;
  --pen:#D3343C; --pen-soft:#FDE6E7; --ok:#18905F; --ok-soft:#DDF4EA;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-pen:"Caveat","Comic Sans MS","Segoe Print",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161D2D; --sunk:#1E2638; --line:#2B3550;
  --ink:#E7EBF5; --muted:#9AA4BB;
  --accent:#7D9BFF; --accent-ink:#0E1320; --accent-soft:#232F55;
  --marker:#E6C640; --marker-ink:#141B2D;
  --pen:#FF7076; --pen-soft:#3A1D25; --ok:#4FD39C; --ok-soft:#173327;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2D; --sunk:#1E2638; --line:#2B3550;
  --ink:#E7EBF5; --muted:#9AA4BB;
  --accent:#7D9BFF; --accent-ink:#0E1320; --accent-soft:#232F55;
  --marker:#E6C640; --marker-ink:#141B2D;
  --pen:#FF7076; --pen-soft:#3A1D25; --ok:#4FD39C; --ok-soft:#173327;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mark{background:linear-gradient(transparent 52%,var(--marker) 52%,var(--marker) 92%,transparent 92%);color:inherit;padding:0 .1em}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem;display:flex;gap:6px;align-items:center}
.stat b{font-family:var(--f-display)}

/* tabs */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--pen)}

.view{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--pen);color:var(--surface)}
.btn.sm{padding:7px 12px;font-size:.875rem}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.input,textarea.input{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:1.05rem}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{min-height:160px;resize:vertical;line-height:1.6}

/* today */
.hello{display:grid;gap:6px}
.mission{display:grid;gap:8px}
.task{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--sunk);border:0;text-align:left;width:100%}
.task .check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:800;background:var(--surface)}
.task.done .check{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.task .t{flex:1;min-width:0}
.task .t b{display:block}
.task .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.weak{display:grid;gap:10px}
.weak-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 46px;gap:10px;align-items:center}
.weak-row span:last-child{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-size:.75rem;color:var(--muted);display:grid;gap:4px;justify-items:center}
.wd i{width:100%;max-width:38px;aspect-ratio:1;border-radius:10px;background:var(--sunk);display:block}
.wd i.on{background:var(--accent)}
.wd i.today{outline:2px solid var(--ink);outline-offset:2px}

/* train */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rule{border-left:4px solid var(--marker);background:var(--sunk);border-radius:0 12px 12px 0;padding:14px 16px;display:grid;gap:8px}
.rule ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.rule .ex{display:grid;gap:2px}
.rule .ex div{display:flex;gap:8px;flex-wrap:wrap}
.pt{font-size:1.35rem;font-family:var(--f-display);font-weight:700;line-height:1.3}
.progress-line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:12px;background:var(--sunk);align-content:flex-start}
.tiles.answer{background:var(--surface);border:2px dashed var(--line)}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:1.05rem;font-weight:700;box-shadow:0 2px 0 var(--line)}
.tiles.answer .tile{background:var(--accent-soft);border-color:var(--accent)}
.result{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.result.good{background:var(--ok-soft)}
.result.bad{background:var(--pen-soft)}
.result.neutral{background:var(--sunk)}
.result .head{font-weight:800;font-family:var(--f-display);font-size:1.1rem}
.result.good .head{color:var(--ok)}
.result.bad .head{color:var(--pen)}
.pen{font-family:var(--f-pen);font-size:1.45rem;color:var(--pen);line-height:1.15;font-weight:700}
.strike{text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px;color:var(--muted)}
.speak{border:0;background:transparent;color:var(--accent);font-weight:700;padding:2px 4px;display:inline-flex;gap:4px;align-items:center}

/* diary */
.prompt-card{display:grid;gap:4px}
.mistakes{display:grid;gap:10px}
.mistake{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;background:var(--surface)}
.corrected{font-size:1.1rem;line-height:1.7;background:var(--sunk);border-radius:12px;padding:14px 16px}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted)}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{transition:none}}

/* chat */
.chat{display:grid;gap:10px;max-height:min(60vh,520px);overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{justify-self:start;background:var(--sunk);border-bottom-left-radius:4px}
.msg .fix{display:block;font-family:var(--f-pen);font-size:1.3rem;color:var(--pen);line-height:1.2;margin-bottom:6px}
.msg .fine{display:block;color:var(--ok);font-weight:700;margin-bottom:6px}
.composer{display:flex;gap:8px}
.composer .input{flex:1;min-width:0}

/* review */
.deck-count{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.li>div{min-width:0}
.box-pill{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.notice{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
/* levels & test */
.levels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.theme{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:14px;text-align:left;display:grid;gap:6px;min-width:0}
.theme b{font-family:var(--f-display);font-size:1.05rem}
.flash{border:2px solid var(--line);background:var(--sunk);border-radius:16px;min-height:200px;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;width:100%}
.flash-en{font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;overflow-wrap:anywhere}
.flash-pt{font-family:var(--f-pen);font-size:1.9rem;color:var(--pen);font-weight:700}
@media (max-width:760px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lvl{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:grid;gap:2px;min-width:0}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lvl b{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.lvl .small{overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-weight:700;font-size:1.05rem}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft)}
.q{font-size:1.3rem;font-family:var(--f-display);font-weight:700}
.done-tag{font-size:.75rem;font-weight:700;color:var(--ok)}
@media (max-width:520px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.panel{padding:16px}.weak-row{grid-template-columns:minmax(0,1fr) 70px 42px}}

/* v5: flashcards, vocab, pron, listening, gram, progress */
.pos{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.state{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid var(--line)}
.st-aprendida{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st-estudando{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st-nova{color:var(--muted)}
.tag{font-size:.75rem;color:var(--muted)}
.hl{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit}
.exline{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:1.1rem}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade .btn{flex-direction:column;gap:2px}
.grade small{font-weight:400;font-size:.75rem;opacity:.85}
.li-word{align-items:flex-start}
.li-btn{border:0;text-align:left;width:100%;cursor:pointer}
.ff-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ff{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.ff-en{font-family:var(--f-display);font-size:1.25rem}
.ff-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ok-t{color:var(--ok)}.bad-t{color:var(--pen)}
.pairs{display:flex;flex-wrap:wrap;gap:8px}
.pair{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:10px;padding:4px}
.ed-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.big-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.big-opts .opt{text-align:center;font-size:1.35rem;padding:18px}
.dict-line{font-size:1.2rem;line-height:1.7}
.w-ok{color:var(--ok);font-weight:700}
.w-miss{color:var(--pen);font-weight:700;text-decoration:underline wavy;text-underline-offset:4px}
.pen-soft{color:var(--ok)}
.gpage{display:grid;gap:12px;overflow-x:auto}
.gpage p{margin:0}
.gpage table{border-collapse:collapse;width:100%;min-width:420px;font-size:.95rem}
.gpage th,.gpage td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.gpage th{background:var(--sunk);font-weight:700}
.g-ex{background:var(--sunk);border-radius:10px;padding:10px 12px}
.g-warn{border-left:4px solid var(--pen);padding:8px 12px;background:var(--pen-soft);border-radius:0 10px 10px 0}
.tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile-stat{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.tile-stat b{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.chart-wrap{overflow-x:auto}
.chart{width:100%;min-width:320px;height:auto;display:block}
.c-grid{stroke:var(--line);stroke-width:1}
.c-ax{fill:var(--muted);font-size:14px;font-family:var(--f-body)}
.c-val{fill:var(--ink);font-size:14px;font-weight:700;font-family:var(--f-body)}
.c-bar{fill:var(--accent);opacity:.55}
.c-bar-today{fill:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:5px;max-width:520px}
.heat i,.heat-key i{display:block;aspect-ratio:1;border-radius:5px;background:var(--sunk);max-width:100%}
.heat-key{display:inline-grid;grid-template-columns:repeat(4,14px);gap:3px}
.heat .h1,.heat-key .h1{background:var(--accent-soft)}
.heat .h2,.heat-key .h2{background:var(--accent);opacity:.6}
.heat .h3,.heat-key .h3{background:var(--accent)}
select.input{appearance:auto}
@media (max-width:480px){.ff-cols{grid-template-columns:1fr}.heat{grid-template-columns:repeat(10,minmax(0,1fr))}}
.tabs[hidden]{display:none}
.brand{font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.01em;color:var(--accent)}
.brand span{color:var(--ink);background:linear-gradient(transparent 55%,var(--marker) 55%,var(--marker) 92%,transparent 92%);padding:0 .08em}
.acct{font-weight:600;font-size:.8rem;color:var(--muted)}
.gate{max-width:520px;margin:24px auto 0;text-align:center;justify-items:center;padding-block:32px}
.gate p{max-width:46ch}
.gate-icon{font-size:2.6rem;line-height:1}
.gate-steps{text-align:left;margin:0;padding-left:1.3em;display:grid;gap:6px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border:0;border-radius:999px;padding:13px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-family:var(--f-body);box-shadow:0 6px 20px rgba(20,27,45,.25);cursor:pointer}
.fab:hover{filter:brightness(1.07)}
.wrap{padding-bottom:96px}
.qa-on .fab{display:none}
.qa-scrim{position:fixed;inset:0;z-index:30;background:rgba(10,14,25,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.qa-sheet{width:min(560px,100%);max-height:calc(100% - 24px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.qa-sheet .seg{flex-wrap:wrap}
@media (min-width:700px){.qa-scrim{align-items:center}}
.toast{z-index:40}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">English<span>yne</span></div>
      <h1>Hi, <span class="mark">Carolayne</span>!</h1>
    </div>
    <div class="stats">
      <span class="stat acct" id="acct" hidden></span>
      <button class="stat acct" id="logout" type="button" hidden onclick="window.netlifyIdentity&&netlifyIdentity.logout()">Sair</button>
      <span class="stat" title="Dias seguidos estudando">🔥 <b id="st-streak">0</b> <span id="st-days">dias</span></span>
      <span class="stat" title="Pontos de experiência">⭐ <b id="st-xp">0</b> XP</span>
      <span class="stat" title="Nível estimado">📈 <b id="st-level">A2</b></span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Seções">
    <button class="tab" role="tab" data-tab="today">Hoje</button>
    <button class="tab" role="tab" data-tab="cards">Flashcards <span class="dot" id="fc-dot" hidden></span></button>

let KEY='ingles-carol-v1';

function defaults(){return {xp:0,days:{},pat:{},deck:[],words:[],chats:{},mode:'lesson',diaryDraft:'',level:'A1',tested:false,done:{},vs:{},journal:[],media:[],notes:[],newPerDay:10,dMode:'quick'}}
function load(){try{const r=localStorage.getItem(KEY);S=Object.assign(defaults(),r?JSON.parse(r):{})}catch(e){S=defaults()}normalize();saveLocal()}
function normalize(){S.deck=S.deck.filter(c=>c.src!=='diag');if(!LEVELS[S.level])S.level='A1';if(!S.done)S.done={};['vs','journal','media','notes'].forEach(k=>{if(!S[k])S[k]=k==='vs'?{}:[]});
  if(S.vk){Object.keys(S.vk).forEach(en=>{if(S.vk[en]===1&&!S.vs[en])S.vs[en]={b:2,d:addDays(today(),2)}});delete S.vk}

/* ================= Conta e sincronização ================= */
const CLOUD={state:'connecting',uid:null,name:'',ref:null,ready:false,writing:false,dirty:false,t:null,timer:null,cached:null};
let APP_READY=!window.ENGLISHYNE_NETLIFY;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.updatedAt=Date.now();saveLocal();if(CLOUD.ref&&CLOUD.ready&&CLOUD.state!=='local'){clearTimeout(CLOUD.t);CLOUD.t=setTimeout(cloudFlush,1200)}}
function packState(){const st=Object.assign({},S);delete st.uid;delete st.syncedAt;
  const keep=new Set(Object.keys(st.chats||{}).sort().slice(-5));st.chats=Object.fromEntries(Object.entries(st.chats||{}).filter(([k])=>keep.has(k)));
  st.journal=(st.journal||[]).slice(0,60);let s=JSON.stringify(st);
  if(s.length>230000){st.chats={};s=JSON.stringify(st)}if(s.length>230000){st.journal=st.journal.slice(0,15);s=JSON.stringify(st)}
  return {v:1,updatedAt:S.updatedAt||Date.now(),state:s}}
async function cloudFlush(){if(!CLOUD.ref)return;if(CLOUD.writing){CLOUD.dirty=true;return}
  CLOUD.writing=true;CLOUD.dirty=false;setSync('saving');
  try{const body=packState();await CLOUD.ref.set(body);S.syncedAt=body.updatedAt;S.uid=CLOUD.uid;saveLocal();setSync('on')}
  catch(e){setSync(e&&e.code==='quota_exceeded'?'full':e&&e.code==='revoked'?'local':'err');if(e&&e.code==='unavailable'){CLOUD.dirty=true}}
  CLOUD.writing=false;if(CLOUD.dirty){clearTimeout(CLOUD.t);CLOUD.t=setTimeout(cloudFlush,2500)}}
function resetViews(){FC.queue=null;TRAIN.queue=null;LS.run=null;PR.run=null;DIARY.res=null;REV.card=null}
function applyRemote(remote,at){S=Object.assign(defaults(),remote);S.updatedAt=at;S.syncedAt=at;S.uid=CLOUD.uid;normalize();
  S.words.forEach(w=>regW({en:w.en,pt:w.pt,ex:w.ex||'',pos:w.pos||'',src:'mine'}));saveLocal();resetViews()}
function onSnap(snap){
  if(snap.metadata.hasPendingWrites)return;
  if(!CLOUD.ready){if(snap.metadata.fromCache){CLOUD.cached=snap;return}decide(snap);return}
  if(!snap.exists)return;const d=snap.data();if(d.updatedAt===S.updatedAt||d.updatedAt<=(S.syncedAt||0))return;
  if(CLOUD.writing||CLOUD.dirty||d.updatedAt<=(S.updatedAt||0))return;
  try{applyRemote(JSON.parse(d.state),d.updatedAt);toast('Progresso atualizado de outro aparelho');render()}catch(e){}
}
function decide(snap){
  if(!snap||!snap.exists){finishLogin();cloudFlush();return}
  const d=snap.data();let remote=null;try{remote=JSON.parse(d.state)}catch(e){}
  if(!remote){finishLogin();cloudFlush();return}
  const localWins=(S.uid===CLOUD.uid&&(S.updatedAt||0)>(S.syncedAt||0)&&(S.updatedAt||0)>d.updatedAt)||(S.uid!==CLOUD.uid&&(S.xp||0)>(remote.xp||0));
  if(localWins){finishLogin();cloudFlush()}else{applyRemote(remote,d.updatedAt);finishLogin();setSync('on')}
}
function finishLogin(){if(CLOUD.ready)return;CLOUD.ready=true;APP_READY=true;clearTimeout(CLOUD.timer);if(CLOUD.state==='connecting')CLOUD.state='on';render()}
function setSync(st){CLOUD.state=st;renderAcct()}
function renderAcct(){const el=document.getElementById('acct');if(!el)return;const first=(CLOUD.name||'').split(' ')[0];
  const txt={connecting:'⏳ Conectando à sua conta…',on:'☁️ Salvo na sua conta'+(first?' · '+first:''),saving:'☁️ Salvando…',err:'⚠️ Sem conexão: salvo neste aparelho',full:'⚠️ Espaço da conta cheio',slow:'⏳ Conectando à conta…',local:'📱 Salvo neste navegador',nouser:'🔒 Sem login'}[CLOUD.state]||'';
  const lo=document.getElementById('logout');if(lo)lo.hidden=!(STANDALONE&&CLOUD.uid&&APP_READY);el.textContent=txt;el.title=CLOUD.state==='on'?'Seu progresso fica numa área privada da sua conta, visível só para você.':'';el.hidden=!txt}
async function cloudInit(){if(STANDALONE)return netlifyInit();
  try{
    if(!window.claude||!claude.use)throw 0;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)throw 0;
    const uid=await user.id();if(!uid)throw 0;
    CLOUD.uid=uid;try{const me=await user.me();CLOUD.name=me&&me.name||''}catch(e){}
    CLOUD.ref=db.doc('data/users/'+uid+'/progress');
    CLOUD.timer=setTimeout(()=>{if(CLOUD.ready)return;if(CLOUD.cached){decide(CLOUD.cached)}else{CLOUD.state='slow';finishLogin();renderAcct()}},10000);
    CLOUD.ref.onSnapshot(onSnap,e=>{clearTimeout(CLOUD.timer);if(!CLOUD.ready){if(CLOUD.cached)decide(CLOUD.cached);else finishLogin()}setSync(e&&e.code==='revoked'?'local':'err')});
    renderAcct();
  }catch(e){CLOUD.state='local';renderAcct()}
}
function vGate(){if(STANDALONE)return vGateNetlify();
  const v=h('section',{class:'view'});
  if(CLOUD.state==='nouser'){
    v.append(h('div',{class:'panel gate'},h('div',{class:'gate-icon'},'🔒'),h('h2',null,'Entre no Englishyne'),
      h('p',null,'Este app usa a sua conta do Claude como login. Assim o seu progresso fica salvo na conta e aparece igual no celular e no computador.'),
      h('ol',{class:'gate-steps'},h('li',null,'Abra este link pelo app ou pelo site do Claude.'),h('li',null,'Entre com a sua conta (o mesmo e-mail de sempre).'),h('li',null,'Volte a este link: o app abre sozinho.')),
      h('p',{class:'small muted'},'Seu progresso fica numa área privada da sua conta. Ninguém mais vê, nem quem compartilhou o link com você.'),
      h('button',{class:'btn ghost',onclick:()=>{CLOUD.state='local';APP_READY=true;render()}},'Usar sem login, só neste aparelho')));
  }else{
    v.append(h('div',{class:'panel gate'},h('div',{class:'gate-icon'},'☁️'),h('h2',null,'Entrando na sua conta…'),h('div',{class:'thinking',style:'justify-content:center'},h('span',{class:'spin'}),'Buscando o seu progresso')));
  }
  return v;
}

function netlifyRef(){
  const call=async(method,body)=>{const u=window.netlifyIdentity&&netlifyIdentity.currentUser();if(!u)throw {code:'revoked'};const t=await u.jwt();
    const r=await fetch('/.netlify/functions/progress',{method,cache:'no-store',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
    if(r.status===401)throw {code:'revoked'};if(!r.ok)throw {code:'unavailable'};return r.json()};
  return {
    set:async body=>{await call('PUT',body)},
    onSnapshot(next,err){let busy=false;const pull=async()=>{if(busy)return;busy=true;try{const d=await call('GET');next({exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}})}catch(e){err&&err(e)}busy=false};
      pull();const again=()=>{if(document.visibilityState==='visible')pull()};document.addEventListener('visibilitychange',again);setInterval(again,60000);return()=>{}}
  };
}

  };
  id.on('init',start);

}

function buildQueue(){
  const L=LEVELS[S.level];TRAIN.qLevel=S.level;
  if(TRAIN.topic!=='mix'&&(!TOPICS[TRAIN.topic]||TOPICS[TRAIN.topic].level!==S.level))TRAIN.topic='mix';
  if(!MODES.some(m=>m[0]===S.mode))S.mode='lesson';
  const ts=TRAIN.topic==='mix'?L.topics:[TOPICS[TRAIN.topic]];
  const plan=['mc','mc','mc','gap','gap','tiles','tiles','tiles','type','type'];
  let queue=[];
  if(S.mode==='lesson'){
    if(ts.length===1){const t=ts[0],q=shuffle(t.q),it=shuffle(t.items);
      queue=[mk('mc',t,q[0]),mk('mc',t,q[1]),mk('mc',t,q[2]),mk('gap',t,q[3]),mk('gap',t,q[4]),mk('tiles',t,it[0]),mk('tiles',t,it[1]),mk('tiles',t,it[2]),mk('type',t,it[3]),mk('type',t,it[4])]}
    else{const seen=new Set();plan.forEach(k=>{let tries=0,t,x;do{t=ts[Math.floor(Math.random()*ts.length)];const src=k==='mc'||k==='gap'?t.q:t.items;x=src[Math.floor(Math.random()*src.length)];tries++}while(seen.has(x[0])&&tries<20);seen.add(x[0]);queue.push(mk(k,t,x))})}
  }else{const k=S.mode;queue=shuffle(ts.flatMap(t=>(k==='mc'||k==='gap'?t.q:t.items).map(x=>mk(k,t,x))));if(ts.length>1)queue=queue.slice(0,10)}

  const heat=h('div',{class:'heat'});for(let i=29;i>=0;i--){const k=addDays(today(),-i);const x=(S.days[k]&&S.days[k].xp)||0;heat.append(h('i',{class:x>=100?'h3':x>=40?'h2':x>0?'h1':'',title:`${new Date(k+'T12:00:00').toLocaleDateString('pt-BR')}: ${x} XP`}))}
  v.append(h('div',{class:'panel'},h('h3',null,'Últimos 30 dias'),heat,h('div',{class:'row small muted'},'Menos',h('span',{class:'heat-key'},h('i'),h('i',{class:'h1'}),h('i',{class:'h2'}),h('i',{class:'h3'})),'Mais')));
  v.append(h('div',{class:'panel'},h('h3',null,'Lições por nível'),h('div',{class:'weak'},LKEYS.map(l=>{const d=levelDone(l),n=LEVELS[l].topics.length;return h('div',{class:'weak-row'},h('span',null,`${l} · ${LEVELS[l].name}`),h('div',{class:'bar'},h('i',{style:`width:${100*d/n}%;background:${d===n?'var(--ok)':'var(--accent)'}`})),h('span',{class:'small'},`${d}/${n}`))}))));
  v.append(h('div',{class:'panel'},h('h3',null,'Vocabulário aprendido'),h('div',{class:'weak'},[...LKEYS.map(l=>[l,Object.values(VOCAB[l]).flat()]),['Phrasal',PV],['Falsos amigos',FF]].map(([l,arr])=>{const k=arr.filter(w=>learned(w.en)).length;
    return h('div',{class:'weak-row'},h('span',null,l),h('div',{class:'bar'},h('i',{style:`width:${100*k/arr.length}%;background:var(--ok)`})),h('span',{class:'small'},`${k}/${arr.length}`))}))));
  return v;
}
/* ================= Aprendi algo novo (anotação rápida) ================= */
POS.frase='frase';
const QA={open:false,kind:'word',en:'',pt:'',ex:'',pos:'',origem:'',title:'',body:'',busy:false,err:'',note:''};
function openQA(kind){Object.assign(QA,{open:true,kind:kind||QA.kind||'word',en:'',pt:'',ex:'',pos:'',origem:'',title:'',body:'',busy:false,err:'',note:''});renderQA();setTimeout(()=>{const f=document.querySelector('#qa input, #qa textarea');if(f)f.focus()},30)}
function closeQA(){QA.open=false;renderQA()}
function qaInput(id,ph,key,opts){const el=h(opts&&opts.area?'textarea':'input',Object.assign({class:'input',id,placeholder:ph,autocomplete:'off',spellcheck:opts&&opts.spell?'true':'false',oninput:e=>{QA[key]=e.target.value}},opts&&opts.area?{style:'min-height:90px'}:{type:'text'}));el.value=QA[key]||'';return el}
function renderQA(){
  let root=document.getElementById('qa');
  if(!QA.open){if(root)root.remove();document.body.classList.remove('qa-on');return}
  if(!root){root=h('div',{id:'qa',class:'qa-scrim',onclick:e=>{if(e.target===root)closeQA()}});document.body.append(root)}
  document.body.classList.add('qa-on');
  const kinds=[['word','Palavra ou expressão'],['phrase','Frase'],['rule','Regra de gramática']];
  const sheet=h('div',{class:'qa-sheet panel',role:'dialog','aria-modal':'true','aria-labelledby':'qa-title'},
    h('div',{class:'progress-line'},h('h2',{id:'qa-title'},'Aprendi algo novo'),h('button',{class:'icon-btn','aria-label':'Fechar',onclick:closeQA},'✕')),
    h('div',{class:'seg',role:'group','aria-label':'O que você aprendeu'},kinds.map(([k,l])=>h('button',{'aria-pressed':QA.kind===k,onclick:()=>{QA.kind=k;QA.err='';renderQA()}},l))));
  if(QA.kind==='rule'){
    sheet.append(h('p',{class:'small muted'},'Anote uma regra ou dica do jeito que você entendeu. Ela fica em Gramática → Minhas anotações.'),
      qaInput('qa-title-in','Título: ex. "Depois de enjoy vem -ing"','title',{spell:true}),
      qaInput('qa-body','Explicação com as suas palavras…','body',{area:true,spell:true}),
      qaInput('qa-ex','Exemplo em inglês (opcional): I enjoy cooking.','ex'));
  }else{
    const isW=QA.kind==='word';
    sheet.append(h('p',{class:'small muted'},isW?'A palavra vai direto para os flashcards e aparece para revisar hoje. Escreva só o inglês (ou só o português) e peça para o Claude completar o resto.':'Guarde uma frase inteira que você ouviu ou leu. Ela entra nos flashcards como as palavras.'),
      h('div',{class:'grid2'},qaInput('qa-en',isW?'Inglês: "look forward to"':'Inglês: "It\'s up to you."','en'),qaInput('qa-pt',isW?'Português: "estar ansiosa por"':'Português: "Você que sabe."','pt',{spell:true})),
      isW?qaInput('qa-ex','Frase de exemplo (opcional): I look forward to the trip.','ex'):null,
      h('div',{class:'grid2'},isW?h('select',{class:'input',id:'qa-pos','aria-label':'Classe gramatical',onchange:e=>{QA.pos=e.target.value}},h('option',{value:''},'Classe gramatical (opcional)'),Object.entries(POS).filter(([k])=>!['ff','frase'].includes(k)).map(([k,l])=>{const o=h('option',{value:k},l);if(QA.pos===k)o.selected=true;return o})):null,
        qaInput('qa-or','Onde aprendeu (opcional): série, trabalho…','origem',{spell:true})),
      QA.note?h('div',{class:'result neutral small'},'✏️ ',QA.note):null,
      aiOn()?h('div',{class:'row'},h('button',{class:'btn ghost sm',disabled:QA.busy,onclick:qaFill},QA.busy?'Completando…':'✨ Completar com o Claude'),QA.busy?h('span',{class:'spin'}):null):null);
  }
  if(QA.err)sheet.append(h('p',{class:'small bad-t'},QA.err));
  sheet.append(h('div',{class:'row'},h('button',{class:'btn',disabled:QA.busy,onclick:qaSave},QA.kind==='rule'?'Salvar anotação':'Salvar nos flashcards'),h('button',{class:'btn ghost',onclick:closeQA},'Cancelar')));
  root.replaceChildren(sheet);
}
async function qaFill(){
  const en=QA.en.trim(),pt=QA.pt.trim();if(!en&&!pt){QA.err='Escreva a palavra em inglês ou em português primeiro.';renderQA();return}
  QA.busy=true;QA.err='';renderQA();
  const isW=QA.kind==='word';
  const prompt=`A Brazilian student (CEFR level ${S.level}) wants to save a new English ${isW?'word or expression':'sentence'} to her flashcards.
${en?`English she wrote: "${en}"`:''}${pt?`\nPortuguese she wrote: "${pt}"`:''}
Fill in what is missing. If her English has a spelling or grammar mistake, fix it.
Reply with ONLY this JSON: {"en":"the correct English ${isW?'word/expression (base form)':'sentence'}","pt":"natural Brazilian Portuguese translation","pos":"${isW?'one of: n, v, adj, adv, pv, exp, prep, conj':'frase'}","ex":"${isW?'one short natural example sentence that uses it, level '+S.level:''}","note":"if you changed her English, explain briefly in Brazilian Portuguese; otherwise empty"}`;
  try{const r=await SAMPLE.json(prompt,{modelTier:'quick'});
    if(r&&r.en&&!en)QA.en=String(r.en);else if(r&&r.en&&norm(r.en)!==norm(en)){QA.en=String(r.en)}
    if(r&&r.pt&&!pt)QA.pt=String(r.pt);
    if(isW&&r&&r.ex&&!QA.ex.trim())QA.ex=String(r.ex);
    if(isW&&r&&POS[r.pos]&&!QA.pos)QA.pos=String(r.pos);
    QA.note=r&&r.note?String(r.note):''}
  catch(e){QA.err=aiErr(e)}
  QA.busy=false;renderQA();
}
function qaSave(){
  if(QA.kind==='rule'){const t=QA.title.trim(),b=QA.body.trim();if(!t&&!b){QA.err='Escreva pelo menos o título ou a explicação.';renderQA();return}
    S.notes.unshift({id:'n'+Date.now(),t:t||b.slice(0,60),b,ex:QA.ex.trim(),at:today()});gain(5);save();closeQA();toast('Anotação salva em Gramática');if(TAB==='gram')render();return}
  const en=QA.en.trim(),pt=QA.pt.trim();if(!en||!pt){QA.err=aiOn()?'Preencha o inglês e o português, ou toque em “Completar com o Claude”.':'Preencha o inglês e o português.';renderQA();return}
  saveWord({en,pt,ex:QA.ex.trim(),pos:QA.kind==='phrase'?'frase':QA.pos,origem:QA.origem.trim(),src:'mine'});gain(5);closeQA();toast('Salvo! Vai aparecer nos seus flashcards hoje');
  if(TAB==='cards'){FC.queue=null}render();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&QA.open)closeQA()});
function notesPanel(){
  const v=h('div',{class:'panel'},h('div',{class:'progress-line'},h('h3',null,`Minhas anotações (${S.notes.length})`),h('button',{class:'btn ghost sm',onclick:()=>openQA('rule')},'+ Nova anotação')));
  if(!S.notes.length){v.append(h('p',{class:'small muted'},'Aprendeu uma regra em aula, num vídeo ou corrigindo um erro? Anote aqui com as suas palavras.'));return v}
  v.append(h('div',{class:'list'},S.notes.map(n=>h('div',{class:'li',style:'align-items:flex-start'},h('div',null,h('b',null,n.t),n.b?h('p',{class:'small',style:'white-space:pre-wrap;margin:2px 0'},n.b):null,n.ex?h('div',{class:'small muted'},n.ex,' ',speakBtn(n.ex)):null,h('div',{class:'small muted'},new Date(n.at+'T12:00:00').toLocaleDateString('pt-BR'))),
    GR.del===n.id?h('button',{class:'btn bad sm',onclick:()=>{S.notes=S.notes.filter(x=>x.id!==n.id);GR.del=null;save();render()}},'Confirmar'):h('button',{class:'icon-btn','aria-label':'Apagar anotação',title:'Apagar',onclick:()=>{GR.del=n.id;render()}},'✕')))));
  return v;
}

/* ================= boot ================= */
load();
try{const t=sessionStorage.getItem('tab');if(t&&t!=='test'&&t!=='quiz')TAB=t}catch(e){}
S.words.forEach(w=>{regW({en:w.en,pt:w.pt,ex:w.ex||'',pos:w.pos||'',src:'mine'});if(!S.vs[w.en])S.vs[w.en]={b:0,d:today()}});saveLocal();
if(!S.tested&&S.xp===0)TAB='today';
if(canSpeak)try{speechSynthesis.getVoices()}catch(e){}
render();
cloudInit();
